name: Sync Skybridge references

on:
  schedule:
    - cron: '0 6 * * *' # every day at 6am UTC
  workflow_dispatch: # triggerable manually from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream Skybridge skill
        run: bash scripts/sync-skybridge-skill.sh

      - name: Package updated skills
        run: |
          if ! git diff --quiet -- plugins/alpic/skills/; then
            bash scripts/package-plugin-skills.sh
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/alpic/skills/ submissions/
          if git diff --staged --quiet; then
            echo "Already up to date, nothing to commit."
          else
            git commit -m "chore: sync skills from upstream"
            git push origin main
          fi
