name: Sync Skybridge skills

on:
  schedule:
    - cron: '0 6 * * *' # every day at 6am UTC
  workflow_dispatch: # triggerable manually from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch skills
        run: |
          rm -rf skills
          npx --yes skills add alpic-ai/skybridge --skill skybridge -a universal -y
          npx --yes skills add alpic-ai/skills -a universal -y
          mv .agents/skills .
          rm -rf .agents

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/
          if git diff --staged --quiet; then
            echo "Already up to date, nothing to commit."
          else
            git commit -m "chore: sync skills from upstream"
            git push origin main
          fi
